<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Copilote Rallye - Cockpit Paysage Pro</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: rgba(21, 21, 26, 0.95);
            --card-border: #2c2c35;
            --accent-red: #ff2a2a;
            --accent-green: #00e676;
            --accent-yellow: #ffe600;
            --accent-blue: #00b0ff;
            --text-main: #ffffff;
            --text-muted: #8e8e99;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111115;
            background-image: 
                linear-gradient(27deg, #16161b 5px, transparent 5px),
                linear-gradient(207deg, #16161b 5px, transparent 5px),
                linear-gradient(27deg, #1e1e24 5px, transparent 5px),
                linear-gradient(207deg, #1e1e24 5px, transparent 5px),
                linear-gradient(90deg, #131317 10px, transparent 10px),
                linear-gradient(#15151a 25%, #121216 25%, #121216 50%, transparent 50%, transparent 75%, #1a1a20 75%, #1a1a20);
            background-size: 20px 20px;
            background-position: 0 0, 10px 0, 10px -10px, 0px 10px, 0 0, 0 0;
            
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            margin-bottom: 6px;
            height: 30px;
        }

        h1 { 
            font-size: 1rem; 
            color: var(--accent-red); 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        .mode-tabs {
            display: flex;
            gap: 6px;
            width: 260px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            cursor: pointer;
            background: rgba(28, 28, 36, 0.95);
            color: var(--text-muted);
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(0, 176, 255, 0.4);
        }

        .landscape-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            height: calc(100vh - 45px);
            box-sizing: border-box;
        }

        .unified-card {
            background: var(--card-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .mode-content { display: none; height: 100%; }
        .mode-content.active { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 100%; }

        button {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 8px 10px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.1s ease;
            box-sizing: border-box;
        }

        button:active { transform: scale(0.98); }

        button:disabled {
            background-color: #222228 !important;
            color: #555566 !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.stop { 
            background-color: var(--accent-red); 
            color: white;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.4);
        }

        button.track-btn { background-color: #9c27b0; color: white; }
        button.track-btn.recording { background-color: #ff9800; color: white; animation: pulse 1.2s infinite; }
        
        button.mic { background-color: var(--accent-red); color: white; }
        button.mic.recording { background-color: #ff9800; color: white; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.01); }
            100% { opacity: 1; transform: scale(1); }
        }

        button.reset { 
            background-color: rgba(15, 15, 20, 0.6); 
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 0.75rem;
            padding: 6px;
            margin-top: 4px;
        }

        .section-divider {
            border: 0;
            height: 1px;
            background: var(--card-border);
            margin: 6px 0;
        }

        .map-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        .map-view {
            width: 100%;
            height: 100%;
            background: #111;
        }
        .center-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            z-index: 1000;
            background: rgba(0, 176, 255, 0.9);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            cursor: pointer;
            width: auto;
            margin: 0;
            text-transform: none;
        }

        .carousel-box {
            background: #0d0d11;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            border: 1px solid var(--card-border);
            margin: 4px 0;
        }
        .note-prev {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 1px 0;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .note-active {
            font-size: 1.25rem;
            color: var(--accent-yellow);
            font-weight: 900;
            margin: 4px 0;
            padding: 8px;
            background: #1c1c24;
            border-radius: 6px;
            border-left: 4px solid var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(255, 230, 0, 0.15);
        }
        .note-next {
            font-size: 0.85rem;
            color: #aaa;
            margin: 1px 0;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 4px;
        }
        .stat-box {
            background: #111116;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 1rem; font-weight: 800; color: var(--text-main); margin-top: 1px; }

        ul { padding-left: 14px; font-size: 0.75rem; color: #ccc; max-height: 85px; overflow-y: auto; margin: 2px 0; text-align: left; }
        li { margin-bottom: 3px; }
        
        .label-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: left;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⏱️ Copilote Pro</h1>
        <div class="mode-tabs">
            <button id="tabRec" class="tab-btn active" onclick="switchMode('rec')">Reco</button>
            <button id="tabRun" class="tab-btn" onclick="switchMode('run')">Course</button>
        </div>
    </header>

    <!-- MODE RECONNAISSANCE -->
    <div id="contentRec" class="mode-content active">
        <div class="unified-card">
            <div>
                <div class="label-title" style="color:#d1c4e9;">1. Enregistrement Tracé</div>
                <button id="btnTrack" class="track-btn" onclick="toggleTrackRecording()">🗺️ Démarrer</button>
                <div style="font-size:0.7rem; color:#d1c4e9; margin-top:2px; text-align:left;" id="trackStatus">Inactif</div>
            </div>

            <hr class="section-divider">

            <div>
                <div class="label-title" style="color:#ff8a80;">2. Dictée Vocale Notes</div>
                <button id="btnMic" class="mic" onclick="toggleNoteListening()">🔴 Activer Micro</button>
                <div style="font-size:0.7rem; color:var(--accent-yellow); margin-top:2px; text-align:left;" id="dictationStatus">En veille</div>
            </div>

            <hr class="section-divider">

            <div>
                <div class="label-title">Notes enregistrées (<span id="countNotes">0</span>)</div>
                <ul id="notesListRec"></ul>
            </div>

            <button class="reset" onclick="resetEverything()">🗑️ Tout effacer</button>
        </div>

        <div class="unified-card" style="padding: 8px;">
            <div class="label-title">🗺️ Carte de Reconnaissance</div>
            <div class="map-container">
                <button class="center-btn" onclick="manualCenter('rec')">📍 Centrer</button>
                <div id="mapRec" class="map-view"></div>
            </div>
        </div>
    </div>

    <!-- MODE ENTRAÎNEMENT / COURSE -->
    <div id="contentRun" class="mode-content">
        <div class="unified-card">
            <div>
                <button id="btnToggle" onclick="toggleSystem()" disabled>🏁 Démarrer Course</button>
                <button class="reset" onclick="resetRunProgress()" style="border-color: #ff9800; color: #ff9800;">🔄 Reset Course</button>
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-label">Vitesse</div>
                    <div class="stat-value"><span id="speed">0</span> <span style="font-size:0.6rem">km/h</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Dist. Actuelle → Suivante</div>
                    <div class="stat-value"><span id="partialDistance">-</span> <span style="font-size:0.6rem">m</span></div>
                </div>
            </div>

            <div style="background:#111; padding:4px 8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.65rem; color:var(--text-muted); text-transform:uppercase;">Statut</span>
                <span id="runStatusText" style="font-size:0.75rem; font-weight:bold; color:var(--accent-red);">Approchez (&lt;15m)</span>
            </div>

            <div>
                <div class="label-title">📋 Carrousel</div>
                <div class="carousel-box">
                    <div id="notePrev" class="note-prev">-</div>
                    <div id="noteActive" class="note-active">En attente</div>
                    <div id="noteNext" class="note-next">-</div>
                </div>
                <div id="distance" style="font-size: 0.7rem; color: var(--text-muted); text-align: center;">-</div>
            </div>
        </div>

        <div class="unified-card" style="padding: 8px;">
            <div class="label-title">🗺️ Suivi GPS Live</div>
            <div class="map-container">
                <button class="center-btn" onclick="manualCenter('run')">📍 Centrer</button>
                <div id="mapRun" class="map-view"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        let notes = JSON.parse(localStorage.getItem('rally_notes')) || [];
        let trackPath = JSON.parse(localStorage.getItem('rally_track')) || [];
        
        let watchId = null;
        let isRaceStarted = false; 
        
        let isTrackingActive = false;
        let isListeningActive = false;
        let recognition = null;

        let lastUserLat = null;
        let lastUserLon = null;
        let lastSpokenTime = 0; 
        let voices = [];

        let mapRec = null, mapRun = null;
        let polylineRec = null, polylineRun = null;
        let markersLayerRec = L.layerGroup(), markersLayerRun = L.layerGroup();
        let userMarkerRec = null, userMarkerRun = null;
        let startMarkerRec = null, startMarkerRun = null;
        let endMarkerRec = null, endMarkerRun = null;

        let autoCenterRec = true, autoCenterRun = true;
        let timerRec = null, timerRun = null;
        let initialCenterDone = false;

        function initMaps() {
            let startLat = lastUserLat || 46.603354;
            let startLon = lastUserLon || 1.888334;

            if (!mapRec) {
                mapRec = L.map('mapRec').setView([startLat, startLon], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapRec);
                markersLayerRec.addTo(mapRec);
                mapRec.on('movestart', () => {
                    autoCenterRec = false;
                    clearTimeout(timerRec);
                    timerRec = setTimeout(() => { autoCenterRec = true; }, 5000); // 5 secondes de pause de recentrage
                });
            }

            if (!mapRun) {
                mapRun = L.map('mapRun').setView([startLat, startLon], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapRun);
                markersLayerRun.addTo(mapRun);
                mapRun.on('movestart', () => {
                    autoCenterRun = false;
                    clearTimeout(timerRun);
                    timerRun = setTimeout(() => { autoCenterRun = true; }, 5000); // 5 secondes de pause de recentrage
                });
            }

            redrawTracksAndMarkers();
        }

        function manualCenter(target) {
            if (lastUserLat === null || lastUserLon === null) {
                alert("Position GPS en attente...");
                return;
            }
            if (target === 'rec' && mapRec) {
                autoCenterRec = true;
                mapRec.setView([lastUserLat, lastUserLon], 17);
            } else if (target === 'run' && mapRun) {
                autoCenterRun = true;
                mapRun.setView([lastUserLat, lastUserLon], 17);
            }
        }

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        updateNotesDisplay();
        startBackgroundGPS();

        function switchMode(mode) {
            document.getElementById('tabRec').className = mode === 'rec' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabRun').className = mode === 'run' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('contentRec').className = mode === 'rec' ? 'mode-content active' : 'mode-content';
            document.getElementById('contentRun').className = mode === 'run' ? 'mode-content active' : 'mode-content';

            setTimeout(() => {
                if (!mapRec || !mapRun) {
                    initMaps();
                } else {
                    mapRec.invalidateSize();
                    mapRun.invalidateSize();
                    if (lastUserLat && lastUserLon) {
                        if (mode === 'rec') mapRec.setView([lastUserLat, lastUserLon], 17);
                        if (mode === 'run' && autoCenterRun) mapRun.setView([lastUserLat, lastUserLon], 17);
                    }
                }
            }, 200);
        }

        function startBackgroundGPS() {
            if (navigator.geolocation && !watchId) {
                watchId = navigator.geolocation.watchPosition(updatePosition, handleError, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                });
            }
        }

        // Distance le long de la trace (évite le piège des épingles)
        function getDistanceAlongTrack(userLat, userLon, targetLat, targetLon) {
            if (!trackPath || trackPath.length === 0) {
                return getDistanceFromLatLonInMeters(userLat, userLon, targetLat, targetLon);
            }

            let closestUserIndex = 0;
            let minUserDist = Infinity;
            for (let i = 0; i < trackPath.length; i++) {
                let d = getDistanceFromLatLonInMeters(userLat, userLon, trackPath[i][0], trackPath[i][1]);
                if (d < minUserDist) {
                    minUserDist = d;
                    closestUserIndex = i;
                }
            }

            let closestNoteIndex = 0;
            let minNoteDist = Infinity;
            for (let i = 0; i < trackPath.length; i++) {
                let d = getDistanceFromLatLonInMeters(targetLat, targetLon, trackPath[i][0], trackPath[i][1]);
                if (d < minNoteDist) {
                    minNoteDist = d;
                    closestNoteIndex = i;
                }
            }

            if (closestNoteIndex <= closestUserIndex) {
                return 0; 
            }

            let totalDist = 0;
            for (let i = closestUserIndex; i < closestNoteIndex; i++) {
                totalDist += getDistanceFromLatLonInMeters(
                    trackPath[i][0], trackPath[i][1], 
                    trackPath[i+1][0], trackPath[i+1][1]
                );
            }

            return totalDist;
        }

        // Distance partielle entre la note active et la suivante le long du tracé
        function getPartialDistanceBetweenNotes(lat1, lon1, lat2, lon2) {
            if (!trackPath || trackPath.length === 0) {
                return getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2);
            }

            let closestIdx1 = 0, minD1 = Infinity;
            for (let i = 0; i < trackPath.length; i++) {
                let d = getDistanceFromLatLonInMeters(lat1, lon1, trackPath[i][0], trackPath[i][1]);
                if (d < minD1) { minD1 = d; closestIdx1 = i; }
            }

            let closestIdx2 = 0, minD2 = Infinity;
            for (let i = 0; i < trackPath.length; i++) {
                let d = getDistanceFromLatLonInMeters(lat2, lon2, trackPath[i][0], trackPath[i][1]);
                if (d < minD2) { minD2 = d; closestIdx2 = i; }
            }

            if (closestIdx2 <= closestIdx1) return 0;

            let partialDist = 0;
            for (let i = closestIdx1; i < closestIdx2; i++) {
                partialDist += getDistanceFromLatLonInMeters(trackPath[i][0], trackPath[i][1], trackPath[i+1][0], trackPath[i+1][1]);
            }
            return partialDist;
        }

        function updatePosition(position) {
            lastUserLat = position.coords.latitude;
            lastUserLon = position.coords.longitude;
            const speedMs = position.coords.speed || 0;
            const speedKmh = Math.round(speedMs * 3.6);

            let speedEl = document.getElementById('speed');
            if (speedEl) speedEl.innerText = speedKmh;

            if (!mapRec || !mapRun) {
                initMaps();
            }

            if (mapRec) {
                if (!userMarkerRec) userMarkerRec = L.circleMarker([lastUserLat, lastUserLon], { radius: 8, color: '#fff', fillColor: '#007aff', fillOpacity: 1 }).addTo(mapRec);
                else userMarkerRec.setLatLng([lastUserLat, lastUserLon]);

                if (!initialCenterDone) {
                    mapRec.setView([lastUserLat, lastUserLon], 17);
                    initialCenterDone = true;
                } else if (autoCenterRec && document.getElementById('contentRec').classList.contains('active')) {
                    mapRec.setView([lastUserLat, lastUserLon], mapRec.getZoom());
                }
            }

            if (mapRun) {
                if (!userMarkerRun) userMarkerRun = L.circleMarker([lastUserLat, lastUserLon], { radius: 8, color: '#fff', fillColor: '#00e676', fillOpacity: 1 }).addTo(mapRun);
                else userMarkerRun.setLatLng([lastUserLat, lastUserLon]);
                if (autoCenterRun && document.getElementById('contentRun').classList.contains('active')) {
                    mapRun.setView([lastUserLat, lastUserLon], mapRun.getZoom());
                }
            }

            if (isTrackingActive) {
                trackPath.push([lastUserLat, lastUserLon]);
                localStorage.setItem('rally_track', JSON.stringify(trackPath));
                redrawTracksAndMarkers();
            }

            const btnToggle = document.getElementById('btnToggle');
            const runStatusText = document.getElementById('runStatusText');
            const partialDistEl = document.getElementById('partialDistance');

            // Vérification permanente de la distance au départ (<= 15m requis)
            if (trackPath.length > 0 && !isRaceStarted) {
                let startPoint = trackPath[0];
                let distToStart = getDistanceAlongTrack(lastUserLat, lastUserLon, startPoint[0], startPoint[1]);
                if (partialDistEl) partialDistEl.innerText = Math.round(distToStart);

                if (distToStart <= 15) {
                    if (btnToggle) btnToggle.disabled = false;
                    if (runStatusText) {
                        runStatusText.innerText = "✅ Départ prêt";
                        runStatusText.style.color = "var(--accent-green)";
                    }
                } else {
                    if (btnToggle) btnToggle.disabled = true;
                    if (runStatusText) {
                        runStatusText.innerText = "❌ Trop loin (>15m)";
                        runStatusText.style.color = "var(--accent-red)";
                    }
                }
            } else if (trackPath.length === 0 && !isRaceStarted) {
                if (btnToggle) btnToggle.disabled = true;
                if (partialDistEl) partialDistEl.innerText = "-";
                if (runStatusText) {
                    runStatusText.innerText = "Aucun tracé";
                    runStatusText.style.color = "var(--accent-red)";
                }
            }

            let dynamicThreshold = 10 + (speedMs * 2.0); 
            if (dynamicThreshold > 100) dynamicThreshold = 100;

            if (isRaceStarted) {
                let noteActiveEl = document.getElementById('noteActive');
                let distanceEl = document.getElementById('distance');
                let notePrevEl = document.getElementById('notePrev');
                let noteNextEl = document.getElementById('noteNext');

                if (notes.length === 0) {
                    if (noteActiveEl) noteActiveEl.innerText = "Aucune note !";
                    if (distanceEl) distanceEl.innerText = "";
                    if (partialDistEl) partialDistEl.innerText = "-";
                    return;
                }

                // Ordre chronologique strict : recherche la première note non jouée
                let currentIndex = -1;
                for (let i = 0; i < notes.length; i++) {
                    if (!notes[i].triggered) {
                        currentIndex = i;
                        break;
                    }
                }

                // Fin automatique de spéciale si toutes les notes sont passées
                if (currentIndex === -1) {
                    if (notePrevEl) notePrevEl.innerText = notes.length > 0 ? "⬆️ " + notes[notes.length - 1].text : "-";
                    if (noteActiveEl) noteActiveEl.innerText = "🏁 FIN DE SPECIALE !";
                    if (noteNextEl) noteNextEl.innerText = "-";
                    if (distanceEl) distanceEl.innerText = "";
                    if (partialDistEl) partialDistEl.innerText = "0";
                    
                    if (isRaceStarted) {
                        speak("Fin de spéciale !");
                        isRaceStarted = false;
                        btnToggle.innerText = "🏁 Démarrer Course";
                        btnToggle.className = "";
                        if (runStatusText) {
                            runStatusText.innerText = "🏁 Spéciale terminée";
                            runStatusText.style.color = "var(--accent-green)";
                        }
                    }
                    return;
                }

                let nextActiveNote = notes[currentIndex];
                let distToActive = getDistanceAlongTrack(lastUserLat, lastUserLon, nextActiveNote.lat, nextActiveNote.lon);
                
                // Distance partielle entre la note active (centre) et la suivante (bas)
                let partialVal = 0;
                if (currentIndex < notes.length - 1) {
                    let followingNote = notes[currentIndex + 1];
                    partialVal = getPartialDistanceBetweenNotes(nextActiveNote.lat, nextActiveNote.lon, followingNote.lat, followingNote.lon);
                } else {
                    partialVal = 0; 
                }

                if (partialDistEl) partialDistEl.innerText = Math.round(partialVal);
                if (distanceEl) distanceEl.innerText = "Note #" + (currentIndex + 1) + " à " + Math.round(distToActive) + "m (Seuil: " + Math.round(dynamicThreshold) + "m)";

                // Carrousel : Haut (précédente), Centre (active à venir), Bas (suivante)
                let prevText = (currentIndex > 0) ? "⬆️ " + notes[currentIndex - 1].text : "⬆️ [Départ]";
                let activeText = `🎯 [${currentIndex + 1}/${notes.length}] ` + nextActiveNote.text;
                let nextText = (currentIndex < notes.length - 1) ? "⬇️ " + notes[currentIndex + 1].text : "⬇️ [Arrivée]";

                if (notePrevEl) notePrevEl.innerText = prevText;
                if (noteActiveEl) noteActiveEl.innerText = activeText;
                if (noteNextEl) noteNextEl.innerText = nextText;

                let now = Date.now();
                if (distToActive <= dynamicThreshold && (now - lastSpokenTime > 4000)) {
                    speak(nextActiveNote.text);
                    nextActiveNote.triggered = true;
                    lastSpokenTime = now;
                    localStorage.setItem('rally_notes', JSON.stringify(notes));
                }
            }
        }

        function toggleTrackRecording() {
            const btn = document.getElementById('btnTrack');
            const status = document.getElementById('trackStatus');

            if (!isTrackingActive) {
                if (lastUserLat === null) {
                    alert("Attends le signal GPS !");
                    return;
                }
                isTrackingActive = true;
                btn.innerText = "⏹️ Stop Tracé";
                btn.className = "track-btn recording";
                status.innerText = "🔴 Enregistrement...";
            } else {
                isTrackingActive = false;
                btn.innerText = "🗺️ Démarrer";
                btn.className = "track-btn";
                status.innerText = "✅ Sauvegardé (" + trackPath.length + ")";
            }
        }

        function toggleNoteListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Reconnaissance vocale non supportée.");
                return;
            }

            const btnMic = document.getElementById('btnMic');
            const statusText = document.getElementById('dictationStatus');

            if (!isListeningActive) {
                if (lastUserLat === null || lastUserLon === null) {
                    alert("Attends le signal GPS !");
                    return;
                }

                recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                recognition.continuous = true;  
                recognition.interimResults = false; 

                let speechStartedLat = null;
                let speechStartedLon = null;

                recognition.onstart = function() {
                    isListeningActive = true;
                    btnMic.innerText = "⏹️ Couper Micro";
                    btnMic.className = "mic recording";
                    statusText.innerText = "🟢 Écoute active";
                };

                recognition.onsoundstart = function() {
                    if (lastUserLat !== null) {
                        speechStartedLat = lastUserLat;
                        speechStartedLon = lastUserLon;
                    }
                };

                recognition.onresult = function(event) {
                    const latestIndex = event.results.length - 1;
                    const spokenText = event.results[latestIndex][0].transcript.trim();

                    let targetLat = speechStartedLat !== null ? speechStartedLat : lastUserLat;
                    let targetLon = speechStartedLon !== null ? speechStartedLon : lastUserLon;

                    if (spokenText && targetLat !== null) {
                        notes.push({
                            lat: targetLat,
                            lon: targetLon,
                            text: spokenText,
                            triggered: false
                        });

                        localStorage.setItem('rally_notes', JSON.stringify(notes));
                        updateNotesDisplay();
                        redrawTracksAndMarkers();
                        
                        statusText.innerText = `✅ "${spokenText}"`;
                        if ('vibrate' in navigator) navigator.vibrate(100);
                    }
                };

                recognition.onerror = function(event) {
                    if (event.error !== 'no-speech') {
                        statusText.innerText = "Erreur: " + event.error;
                    }
                };

                recognition.onend = function() {
                    if (isListeningActive) {
                        try { recognition.start(); } catch(e) {}
                    }
                };

                recognition.start();

            } else {
                isListeningActive = false;
                if (recognition) recognition.stop();
                btnMic.innerText = "🔴 Activer Micro";
                btnMic.className = "mic";
                statusText.innerText = "En veille";
            }
        }

        // Tracés et marqueurs distinctifs départ (vert) / arrivée (rouge)
        function redrawTracksAndMarkers() {
            let startIcon = L.divIcon({
                className: 'custom-start-marker',
                html: '<div style="background-color: #00e676; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 8px #00e676;"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            let endIcon = L.divIcon({
                className: 'custom-end-marker',
                html: '<div style="background-color: #ff2a2a; width: 16px; height: 16px; border-radius: 4px; border: 2px solid #fff; box-shadow: 0 0 10px #ff2a2a; text-align:center; color:white; font-weight:bold; font-size:10px; line-height:12px;">🏁</div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            if (mapRec) {
                if (polylineRec) mapRec.removeLayer(polylineRec);
                if (trackPath.length > 0) {
                    polylineRec = L.polyline(trackPath, { color: '#00b0ff', weight: 4, opacity: 0.8 }).addTo(mapRec);
                    
                    if (!startMarkerRec) {
                        startMarkerRec = L.marker([trackPath[0][0], trackPath[0][1]], { icon: startIcon }).addTo(mapRec).bindPopup("🟢 Ligne de Départ");
                    } else {
                        startMarkerRec.setLatLng(trackPath[0]);
                    }

                    let lastPoint = trackPath[trackPath.length - 1];
                    if (!endMarkerRec) {
                        endMarkerRec = L.marker([lastPoint[0], lastPoint[1]], { icon: endIcon }).addTo(mapRec).bindPopup("🏁 Ligne d'Arrivée");
                    } else {
                        endMarkerRec.setLatLng(lastPoint);
                    }
                }
                
                markersLayerRec.clearLayers();
                notes.forEach((note, index) => {
                    let marker = L.marker([note.lat, note.lon]).bindPopup(`<b>#${index + 1}</b> : ${note.text}`);
                    markersLayerRec.addLayer(marker);
                });
            }

            if (mapRun) {
                if (polylineRun) mapRun.removeLayer(polylineRun);
                if (trackPath.length > 0) {
                    polylineRun = L.polyline(trackPath, { color: '#00e676', weight: 4, opacity: 0.8 }).addTo(mapRun);
                    
                    if (!startMarkerRun) {
                        startMarkerRun = L.marker([trackPath[0][0], trackPath[0][1]], { icon: startIcon }).addTo(mapRun).bindPopup("🟢 Ligne de Départ");
                    } else {
                        startMarkerRun.setLatLng(trackPath[0]);
                    }

                    let lastPoint = trackPath[trackPath.length - 1];
                    if (!endMarkerRun) {
                        endMarkerRun = L.marker([lastPoint[0], lastPoint[1]], { icon: endIcon }).addTo(mapRun).bindPopup("🏁 Ligne d'Arrivée");
                    } else {
                        endMarkerRun.setLatLng(lastPoint);
                    }
                }
                
                markersLayerRun.clearLayers();
                notes.forEach((note, index) => {
                    let marker = L.marker([note.lat, note.lon]).bindPopup(`<b>#${index + 1}</b> : ${note.text}`);
                    markersLayerRun.addLayer(marker);
                });
            }
        }

        function resetEverything() {
            if (confirm("Effacer tout le tracé et les notes ?")) {
                notes = [];
                trackPath = [];
                localStorage.removeItem('rally_notes');
                localStorage.removeItem('rally_track');
                
                if (startMarkerRec) { mapRec.removeLayer(startMarkerRec); startMarkerRec = null; }
                if (endMarkerRec) { mapRec.removeLayer(endMarkerRec); endMarkerRec = null; }
                if (startMarkerRun) { mapRun.removeLayer(startMarkerRun); startMarkerRun = null; }
                if (endMarkerRun) { mapRun.removeLayer(endMarkerRun); endMarkerRun = null; }

                initialCenterDone = false;
                updateNotesDisplay();
                redrawTracksAndMarkers();
                
                isTrackingActive = false;
                isListeningActive = false;
                isRaceStarted = false;
                if (recognition) recognition.stop();
                
                document.getElementById('btnTrack').innerText = "🗺️ Démarrer";
                document.getElementById('btnTrack').className = "track-btn";
                document.getElementById('trackStatus').innerText = "Inactif";
                document.getElementById('btnMic').innerText = "🔴 Activer Micro";
                document.getElementById('btnMic').className = "mic";
                document.getElementById('dictationStatus').innerText = "En veille";
                
                alert("Réinitialisé !");
            }
        }

        function toggleSystem() {
            const btn = document.getElementById('btnToggle');
            const runStatusText = document.getElementById('runStatusText');

            if (!isRaceStarted) {
                if (notes.length === 0) {
                    alert("Aucune note enregistrée !");
                    return;
                }
                isRaceStarted = true;
                btn.innerText = "Arrêter Course";
                btn.className = "stop";
                if (runStatusText) {
                    runStatusText.innerText = "🚀 EN COURSE !";
                    runStatusText.style.color = "var(--accent-green)";
                }
                speak("Départ validé. C'est parti !");
            } else {
                isRaceStarted = false;
                btn.innerText = "🏁 Démarrer Course";
                btn.className = "";
                if (runStatusText) {
                    runStatusText.innerText = "En pause";
                    runStatusText.style.color = "var(--text-muted)";
                }
                let noteActiveEl = document.getElementById('noteActive');
                if (noteActiveEl) noteActiveEl.innerText = "Course en pause";
            }
        }

        function resetRunProgress() {
            notes.forEach(note => note.triggered = false);
            localStorage.setItem('rally_notes', JSON.stringify(notes));
            isRaceStarted = false;
            
            const btnToggle = document.getElementById('btnToggle');
            if (btnToggle) {
                btnToggle.innerText = "🏁 Démarrer Course";
                btnToggle.className = "";
                btnToggle.disabled = true;
            }

            const runStatusText = document.getElementById('runStatusText');
            if (runStatusText) {
                runStatusText.innerText = "Approchez (<15m)";
                runStatusText.style.color = "var(--accent-red)";
            }

            let notePrev = document.getElementById('notePrev');
            let noteActive = document.getElementById('noteActive');
            let noteNext = document.getElementById('noteNext');
            let distance = document.getElementById('distance');
            let partialDistEl = document.getElementById('partialDistance');

            if (notePrev) notePrev.innerText = "-";
            if (noteActive) noteActive.innerText = "Rejoins le départ";
            if (noteNext) noteNext.innerText = "-";
            if (distance) distance.innerText = "";
            if (partialDistEl) partialDistEl.innerText = "-";

            speak("Notes réinitialisées.");
        }

        function updateNotesDisplay() {
            const list = document.getElementById('notesListRec');
            document.getElementById('countNotes').innerText = notes.length;
            list.innerHTML = "";

            if (notes.length === 0) {
                list.innerHTML = "<li>Aucune note.</li>";
                return;
            }

            notes.forEach((note, index) => {
                let li = document.createElement('li');
                li.innerHTML = `<b>#${index + 1}</b> : ${note.text} <button onclick="deleteNote(${index})" style="background:none; border:none; color:var(--accent-red); cursor:pointer; font-size:0.7rem; float:right; width:auto; padding:0; margin:0;">[Suppr]</button>`;
                list.appendChild(li);
            });
        }

        function deleteNote(index) {
            notes.splice(index, 1);
            localStorage.setItem('rally_notes', JSON.stringify(notes));
            updateNotesDisplay();
            redrawTracksAndMarkers();
        }

        function handleError(error) {
            let statusEl = document.getElementById('status');
            if (statusEl) statusEl.innerText = "GPS Erreur : " + error.message;
        }

        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))); 
        }

        function deg2rad(deg) { return deg * (Math.PI / 180); }

        // Synthèse vocale sécurisée sans coupure abrupte
        function speak(text) {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 1.1;
                utterance.pitch = 0.95;

                if (voices.length === 0) { loadVoices(); }
                let naturalVoice = voices.find(v => v.lang.includes('fr') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Siri') || v.name.includes('Amelie')));
                if (naturalVoice) utterance.voice = naturalVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        window.onload = function() {
            initMaps();
        };
    </script>
